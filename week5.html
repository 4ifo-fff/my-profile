<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC高校</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50">

    <!-- ヘッダー -->
    <header class="bg-white shadow px-6 py-4">
      <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-2">
        <h1 class="text-xl font-bold text-orange-800">ABC高校</h1>
        <nav class="flex flex-col md:flex-row gap-2 md:gap-6 text-sm">
          <a href="#" class="text-gray-700 hover:text-green-600">ホーム</a>
          <a href="#" class="text-gray-700 hover:text-green-600">在校生へ</a>
          <a href="#" class="text-gray-700 hover:text-green-600">受験生へ</a>
        </nav>
      </div>
    </header>

    <!-- メイン -->
    <main class="max-w-4xl mx-auto px-6 py-10">

      <!-- ヒーローエリア -->
      <section class="mb-10 text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">生徒が自慢です</h2>
        <p class="text-gray-600">本校の生徒たちは、学問だけでなく、社会に貢献する人材として社会で活躍しています。</p>
      </section>

      <!-- 活動内容カード -->
      <section class="mb-10">
        <h2 class="text-xl font-bold mb-4">ホーム</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
            <p class="text-2xl mb-2">👔</p>
            <h3 class="font-bold">制服</h3>
            <p class="text-gray-500 text-sm mt-1">本校の制服は、３つの選択肢から選ぶことが可能です。１０通り以上のパターンがあります。</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
            <p class="text-2xl mb-2">🎉</p>
            <h3 class="font-bold">学校行事</h3>
            <p class="text-gray-500 text-sm mt-1">文化祭、体育祭では生徒たちが自主的に主催し、大規模で市内でも人気です。</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
            <p class="text-2xl mb-2">🔤</p>
            <h3 class="font-bold">英語教育</h3>
            <p class="text-gray-500 text-sm mt-1">高校1年生では半分の生徒がオーストラリアに留学できます</p>
          </div>
        </div>
      </section>

    </main>

    <!-- フッター -->
    <footer class="bg-yellow-700 text-brown-400 text-sm text-center py-6">
      <p></p>&copy; 2025 ABC高校</p>
    </footer>

  </body>
</html>
