<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算ツール</title>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    
  <div class="bg-white rounded-lg shadow p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6">BMI計算ツール</h1>

    <div class="mb-4">
      <label class="block text-sm font-medium text-blue-500 mb-1">身長　(cm)</label>
      <input id="height" type="number" class="w-full border border-gray-500 rounded px-3 py-2" placeholder="例: 170">
    </div>

    <div class="mb-6">
      <label class="block text-sm font-medium text-blue-500 mb-1">体重　(kg)</label>
      <input id="weight" type="number" class="w-full border border-gray-500 rounded px-3 py-2" placeholder="例: 65">
    </div>

    <button id="calculateBtn" class="w-full bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition">計算</button>

    <p id="result" class="mt-6 text-center text-lg font-bold text-gray-800"></p>
</div>

  <script>
    function calcBmi(height, weight) {
      const heightM = height / 100;
      return weight / (heightM * heightM);
    }

    function getJudgement(bmi) {
      if (bmi < 18.5) {
        return "痩せ型";
      } else if (bmi < 25) {
        return "普通";
      } else {
        return "肥満";
      }
    }

    const button = document.querySelector("#calculateBtn");
    const result = document.querySelector("#result");

    button.addEventListener("click", () => {
      const height = Number(document.querySelector("#height").value);
      const weight = Number(document.querySelector("#weight").value);

      if (height <= 0 || weight <= 0) {
        result.textContent = "身長と体重を正しく入力してください。";
        return;
      }

      const bmi = calcBmi(height, weight);
      const judgement = getJudgement(bmi);

      result.textContent = "BMI: " + bmi.toFixed(1) + " (" + judgement + ")";
    });
  </script>

  </body>
</html>
