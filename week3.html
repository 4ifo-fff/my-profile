<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介カード</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 py-8">
    <main class="max-w-4xl mx-auto px-4">
    <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">チームメンバー</h1>

    <!-- カードを横３枚並びにする。スマホは縦１列　-->
    <div class="flex flex-col md:flex-row gap-6">
    
    <div class="bg-white rounded-lg shadow p-6 flex flex-col items-center">
        <span class="text-4xl">🏃</span>
        <h2 class="text-lg font-bold text-gray-900 mt-3">みわ</h2>   
        <p class="text-gray-600 text-sm mt-2 text-center">運動神経良い。高校では短距離。</p>
    </div>

    <div class="bg-white rounded-lg shadow p-6 flex flex-col items-center">
        <span class="text-4xl">🔢</span>
        <h2 class="text-lg font-bold text-green-900 mt-3">りお</h2>
        <p class="text-gray-600 text-sm mt-2 text-center">金沢出身。塾講のバイトでスーツ着てる。</p>
    </div>

    <div class="bg-white rounded-lg shadow p-6 flex flex-col items-center">
        <span class="text-4xl">🎾</span>
        <h2 class="text-lg font-bold text-blue-900 mt-3">しのん</h2>
        <p class="text-gray-600 text-sm mt-2 text-center">テニスすごいうまい。マイペース。</p>
    </div>

   </div>
  </main>  
 </body>
</html>
